name: Release

# Releases build when WIP lands on main (dev -> main merge). The tag and
# release name are created by the workflow from the stamped version.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Must match .fvmrc so CI builds the same artifact as local `fvm`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      # versionName carries the commit it was built from:
      # 1.0.0+1 -> 1.0.0-abcdef0+1 (pubspec base + short SHA + build no).
      - name: Stamp version with commit SHA
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          STAMPED="$BASE-${GITHUB_SHA::7}+$BUILD"
          sed -i "s/^version:.*/version: $STAMPED/" pubspec.yaml
          echo "version=$STAMPED" >> "$GITHUB_OUTPUT"
          echo "Stamped version: $STAMPED"

      - name: Quality gate
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/geergit-root-helper.keystore

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: geergit-root-helper.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
