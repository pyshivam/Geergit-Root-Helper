name: Release

# Releases build when WIP lands on main (dev -> main merge). The tag and
# release name are created by the workflow from the stamped version.
# Path filter: only Flutter/native/tooling changes need an APK rebuild —
# docs, plans, and screenshots merge without CI.
on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "scripts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Must match .fvmrc so CI builds the same artifact as local `fvm`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      # Gradle dependency + configuration cache: biggest lever for CI
      # build time on repeat runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # versionName carries the version, the commit it was built from and a
      # build number that bumps on every release:
      #   1.0.0+1 -> 1.0.1-abcdef0+2 -> 1.0.2-1234567+3 ...
      # `scripts/stamp_version.sh` bumps the patch level per release; edit
      # `version:` in pubspec.yaml to jump further (1.1.0, 2.0.0).
      - name: Stamp version with commit SHA, bump version and build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMPED=$(bash scripts/stamp_version.sh)
          echo "version=$STAMPED" >> "$GITHUB_OUTPUT"

      - name: Quality gate
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/geergit-root-helper.keystore

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: geergit-root-helper.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            📋 Curated history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ## Changes since the previous release
          files: build/app/outputs/flutter-apk/app-release.apk
          # Auto-generates the per-commit change list, appended below the body.
          generate_release_notes: true
